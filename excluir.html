<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excluir filme | Meus Filmes</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/modern-normalize.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/formularios.css">
  <script type="module" src="js/componentes.js"></script>
  <script type="module" src="js/excluir.js"></script>
</head>
<body>
  <app-header></app-header>
  <app-nav></app-nav>

  <main class="container">
    <section class="painel">
      <h2>Excluir filme</h2>

      <div class="campo">
        <label for="escolher-filme">Filme</label>
        <select id="escolher-filme"></select>
      </div>

      <p id="mensagem" class="mensagem" role="status" hidden></p>

      <div id="area-exclusao" hidden>
        <p>Você vai excluir este filme:</p>
        <dl id="detalhes" class="detalhes"></dl>
        <div class="acoes">
          <button type="button" id="btn-excluir" class="botao botao--perigo">Excluir filme</button>
          <a class="botao botao--secundario" href="index.html">Cancelar</a>
        </div>
      </div>
    </section>
  </main>

  <app-footer></app-footer>
</body>
</html>
